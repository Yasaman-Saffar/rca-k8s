apiVersion: v1
kind: ServiceAccount
metadata:
  name: rca-agent
  namespace: rca-agent-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rca-agent-readonly
  namespace: rca-agent-test
rules:
  - apiGroups: ["", "apps", "batch", "networking.k8s.io"]
    resources:
      - pods
      - pods/log
      - events
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
      - services
      - endpoints
      - configmaps
      - jobs
      - cronjobs
      - ingresses
      - persistentvolumeclaims
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rca-agent-binding
  namespace: rca-agent-test
subjects:
  - kind: ServiceAccount
    name: rca-agent
    namespace: rca-agent-test
roleRef:
  kind: Role
  name: rca-agent-readonly
  apiGroup: rbac.authorization.k8s.io
